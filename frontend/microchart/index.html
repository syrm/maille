<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>microchart-res — demo</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;padding:2rem;min-height:100vh}
    .page{max-width:1100px;margin:0 auto}
    header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
    header h1{font-size:1.4rem;font-weight:700}
    header h1 span{color:#58a6ff}
    header p{font-size:.82rem;color:#8b949e;margin-top:.2rem}
    .badges{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
    .badge{font-size:.72rem;font-weight:600;padding:.2rem .55rem;border-radius:20px;letter-spacing:.03em}
    .badge.g{background:#1a3626;color:#3fb950;border:1px solid #2d5a3d}
    .badge.b{background:#0d2040;color:#58a6ff;border:1px solid #1a3a6e}
    .badge.y{background:#2d1f00;color:#f0883e;border:1px solid #5a3a00}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
    .span2{grid-column:span 2}
    .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:1.25rem}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
    .card-header h2{font-size:.85rem;font-weight:600;color:#c9d1d9}
    .tag{font-size:.68rem;font-weight:500;padding:.18rem .5rem;border-radius:4px;background:#21262d;color:#8b949e;font-family:monospace}
    .chart{width:100%;height:260px}
    .chart-sm{width:100%;height:220px}
    @media(max-width:680px){.grid{grid-template-columns:1fr}.span2{grid-column:span 1}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>micro<span>chart</span> — ReScript</h1>
        <p>SVG · zéro dépendance runtime · OCaml type system · compile → JS propre</p>
      </div>
      <div class="badges">
        <span class="badge g" id="badge-min">⏳ …</span>
        <span class="badge b" id="badge-gz">⏳ …</span>
        <span class="badge y">ReScript 11</span>
      </div>
    </header>
    <div class="grid">
      <div class="card span2">
        <div class="card-header"><h2>Ventes mensuelles</h2><span class="tag">Bar.make</span></div>
        <div id="bar" class="chart"></div>
      </div>
      <div class="card">
        <div class="card-header"><h2>EUR/USD — area</h2><span class="tag">Line.make · area</span></div>
        <div id="line" class="chart-sm"></div>
      </div>
      <div class="card">
        <div class="card-header"><h2>Répartition budget</h2><span class="tag">Pie.make</span></div>
        <div id="pie" class="chart-sm"></div>
      </div>
      <div class="card">
        <div class="card-header"><h2>Multi-séries crypto</h2><span class="tag">Line.make · dashed</span></div>
        <div id="multi" class="chart-sm"></div>
      </div>
      <div class="card">
        <div class="card-header"><h2>Statut projets</h2><span class="tag">Pie.make · donut</span></div>
        <div id="donut" class="chart-sm"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/Demo.mjs"></script>
</body>
</html>
