apiVersion: apps/v1
kind: Deployment
metadata:
  name: maille-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
              hostPort: 15542
          env:
            - name: POSTGRES_DB
              value: "notbeancount"
            - name: POSTGRES_USER
              value: "notbeancount"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notbeancount-database
                  key: password
          args:
            - "postgres"
            # --- Mémoire ---
            - "-c" 
            - "shared_buffers=512MB"
            - "-c"
            - "work_mem=64MB"
            - "-c"
            - "maintenance_work_mem=256MB"
            - "-c"
            - "effective_cache_size=1536MB"

        # --- WAL / Write optimization ---
            - "-c"
            - "wal_level=minimal"
            - "-c"
            - "max_wal_senders=0"
            - "-c"
            - "wal_buffers=64MB"
            - "-c"
            - "wal_writer_delay=200ms"
            - "-c"
            - "checkpoint_completion_target=0.9"
            - "-c"
            - "max_wal_size=4GB"
            - "-c"
            - "min_wal_size=1GB"

        # --- Durabilité relâchée (perf > safety) ---
            - "-c"
            - "synchronous_commit=off"
            - "-c"
            - "fsync=on"
            - "-c"
            - "full_page_writes=off"

        # --- Autovacuum moins agressif pendant les inserts ---
            - "-c"
            - "autovacuum_naptime=60s"
            - "-c"
            - "autovacuum_vacuum_cost_delay=20ms"

        # --- Connexions & parallélisme ---
            - "-c"
            - "max_connections=200"
            - "-c"
            - "commit_delay=100"
            - "-c"
            - "commit_siblings=5"

        # --- Logging minimal ---
            - "-c"
            - "logging_collector=off"
            - "-c"
            - "log_min_duration_statement=-1"

          resources:
            limits:
              memory: "2Gi"
              cpu: "2"
          requests:
            memory: "1Gi"
            cpu: "1"
          
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/internal/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

