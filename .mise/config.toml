[tools]
go = "1.26.6"
gleam = "1.18.1"
erlang = "28.5"
rebar = "3.27.0"
postgres = "18.6"
air = "1.67.4"
node = "24"

[env]
DATABASE_URL = "postgres://maille@localhost:15432/maille_orb?sslmode=disable"
TRACING_ENDPOINT = ""

[tasks.frontend-build]
description = "Compile l'interface ReScript/Vite"
dir = "frontend"
run = "npm run build"

[tasks.local-build]
description = "Compile le frontend et le serveur Go"
depends = ["frontend-build"]
run = "go build -o ./tmp/server ./cmd/maille"

[tasks.serve]
description = "Compile le frontend puis lance le serveur"
depends = ["frontend-build"]
run = "go run ./cmd/maille"

[tasks.test]
description = "Vérifie le frontend et exécute les tests Go"
run = [
  "cd frontend && npm run build",
  "go test ./...",
]

[tasks.set-secret]
usage = '''
arg "<secret>" help="password of database/and pod database secret"
'''
run = '''#!/usr/bin/elvish
  var a = (echo $E:usage_secret | base64 -w0); printf '{"password": "'$a'"}'"\n" | podman secret create --replace maille-database -
  var a = (printf 'postgres://maille:'$E:usage_secret'@postgres:5432/maille' | base64 -w0); printf '{"database": "'$a'"}'"\n" | podman secret create --replace maille-database-url -
'''

[tasks.front]
dir = "frontend"
run = "npm run build"

[tasks.build]
run = "podman build --layers -t localhost/maille-dev:latest -f deploy/Containerfile.dev ."

[tasks.deploy-network]
run = "podman network create maille-network"

[tasks.deploy-postgresql]
run = "podman play kube --network maille-network --replace deploy/postgresql.yaml"

[tasks.deploy-pod]
run = "podman play kube --network maille-network --network docker-monitoring_public --replace deploy/dev-pod.yaml"

[tasks.deploy]
depends = ["build", "deploy-network", "deploy-postgresql", "deploy-pod"]
